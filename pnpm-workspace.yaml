packages:
  - 'apps/*'
  - 'packages/*'

# Dependencias con scripts de instalación. Ninguna es necesaria hoy:
# @parcel/watcher (modo watch de Jest) trae binarios precompilados por plataforma.
# prisma (preinstall) solo comprueba la versión de Node, que ya fija .nvmrc.
# @prisma/engines (postinstall) descarga el schema engine, pero la CLI de Prisma
# lo descarga igualmente en su primer uso si falta.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  prisma: false
  # Dependencias transitivas de Testcontainers (docker-modem -> ssh2):
  # ssh2 y cpu-features compilan módulos nativos opcionales; ssh2 tiene alternativa en
  # JS puro y Testcontainers no usa SSH contra Docker local ni en la CI.
  # protobufjs (postinstall) solo ajusta el esquema de versiones del paquete.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Dependencia transitiva de swagger-ui-dist (@nestjs/swagger): su postinstall solo
  # envía telemetría de uso; Swagger UI funciona igual sin ejecutarlo.
  '@scarf/scarf': false
